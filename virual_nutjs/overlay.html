<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Pointer Overlay</title>
  <link rel="stylesheet" href="pointer.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: transparent;
      user-select: none;
    }

    #overlay-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="overlay-container">
    <div id="virtual-pointer" class="virtual-pointer arrow red"></div>
    <div id="pointer-label" class="virtual-pointer-label"></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const pointer = document.getElementById('virtual-pointer');
    const label = document.getElementById('pointer-label');

    let currentX = 500;
    let currentY = 500;
    let currentShape = 'arrow';
    let currentColor = 'red';
    let currentState = '';

    // Update cursor position
    ipcRenderer.on('cursor-update', (event, data) => {
      currentX = data.x;
      currentY = data.y;

      pointer.style.left = `${data.x}px`;
      pointer.style.top = `${data.y}px`;

      // Update label if provided
      if (data.label) {
        label.textContent = data.label;
        label.style.left = `${data.x}px`;
        label.style.top = `${data.y}px`;
        label.classList.add('visible');
      } else {
        label.classList.remove('visible');
      }

      // Add animated class if specified
      if (data.animated) {
        pointer.classList.add('animated');
      } else {
        pointer.classList.remove('animated');
      }
    });

    // Set visibility
    ipcRenderer.on('set-visibility', (event, visible) => {
      if (visible) {
        pointer.classList.remove('hidden');
      } else {
        pointer.classList.add('hidden');
      }
    });

    // Set shape
    ipcRenderer.on('set-shape', (event, shape) => {
      pointer.classList.remove(currentShape);
      currentShape = shape;
      pointer.classList.add(shape);
    });

    // Set color
    ipcRenderer.on('set-color', (event, color) => {
      pointer.classList.remove(currentColor);
      currentColor = color;
      pointer.classList.add(color);
    });

    // Set state (clicking, dragging, glow)
    ipcRenderer.on('set-state', (event, state) => {
      // Remove previous state
      pointer.classList.remove('clicking', 'dragging', 'glow');

      if (state) {
        pointer.classList.add(state);

        // Remove clicking state after animation
        if (state === 'clicking') {
          setTimeout(() => {
            pointer.classList.remove('clicking');
          }, 300);
        }
      }
    });

    // Initialize position
    pointer.style.left = `${currentX}px`;
    pointer.style.top = `${currentY}px`;

    console.log('Virtual pointer overlay initialized');
    console.log(`Initial position: (${currentX}, ${currentY})`);
    console.log('Pointer element:', pointer);
  </script>
</body>
</html>
